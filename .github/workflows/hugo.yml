name: Deploy Hugo site and refresh feeds

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # UTC; avoid the busy start of each hour. Actual execution may be delayed.
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore the last recruitment snapshot
        uses: actions/cache/restore@v4
        with:
          path: static/data/hangzhou-jobs.json
          key: jobs-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobs-v1-
      - name: Restore the last GitHub edition
        uses: actions/cache/restore@v4
        with:
          path: .cache/github-daily.json
          key: github-daily-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-daily-v1-
      - name: Check feed filtering and fallback
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          node scripts/test_jobs_feed.cjs
      - name: Validate learning progress
        run: python scripts/validate_learning_progress.py
      - name: Refresh public recruitment sources
        run: python scripts/update_jobs.py
      - name: Keep the recruitment snapshot
        uses: actions/cache/save@v4
        with:
          path: static/data/hangzhou-jobs.json
          key: jobs-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Refresh daily GitHub discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_github_daily.py
      - name: Keep the GitHub edition and recent history
        uses: actions/cache/save@v4
        with:
          path: .cache/github-daily.json
          key: github-daily-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.156.0'
          extended: true
      - name: Build
        run: hugo --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

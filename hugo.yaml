baseURL: "https://wishbottle.cn/"
title: "WishBottle"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
hasCJKLanguage: true
theme: "typo-blue"
taxonomies:
  tag: tags
params:
  description: "记录代码，也记录理解的过程。Java、操作系统与 AI 学习笔记。"
  theme: light
  paginationSize: 30
  menu:
    - { name: "文章", url: "/posts/" }
    - { name: "系列", url: "/series/" }
    - { name: "归档", url: "/archives/" }
    - { name: "搜索", url: "/search/" }
    - { name: "关于", url: "/about/" }
outputs:
  home: [HTML, RSS, JSON]
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]

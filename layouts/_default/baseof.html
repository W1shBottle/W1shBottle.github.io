<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>{{ partial "head.html" . }}</head>
<body class="{{ .Param "theme" | default "light" }}">
  <a class="skip-content" href="#main-content">跳转到正文</a>
  <div class="content">
    <header class="site-shell" id="top">{{ partial "header.html" . }}</header>
    <main id="main-content" class="main {{ if .IsHome }}home-main{{ else }}reading-main{{ end }}">{{ block "main" . }}{{ end }}</main>
  </div>
  {{ partial "functions/get_hook.html" (dict "hook" "body_end" "context" .) }}
  <footer>{{ partial "footer.html" . }}</footer>
  {{ if .Param "math" }}{{ partialCached "math.html" . }}{{ end }}
  <script defer src="{{ "js/copy-code.js" | relURL }}"></script>
</body>
</html>

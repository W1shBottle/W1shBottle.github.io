<aside class="jobs-widget" aria-labelledby="jobs-heading" data-feed="{{ "/data/hangzhou-jobs.json" | relURL }}">
  <div class="jobs-top"><h2 id="jobs-heading"><span aria-hidden="true">↗</span> 杭州招聘速递</h2><span class="jobs-scope">实习 / 校招</span></div>
  <div class="jobs-digest"><p class="jobs-overview">正在核验企业招聘信息…</p><a class="jobs-all" href="{{ "/jobs/" | relURL }}">全部岗位 ↗</a></div>
  <div class="jobs-slide" aria-live="off"><p class="jobs-empty">正在读取岗位信息…</p></div>
  <div class="jobs-bottom">
    <p class="jobs-status" role="status">Java 后端 · AI 应用开发</p>
    <div class="jobs-controls" hidden><span class="jobs-count"></span><button type="button" data-action="previous" aria-label="上一个岗位">←</button><button type="button" data-action="pause" aria-label="暂停自动轮播">暂停</button><button type="button" data-action="next" aria-label="下一个岗位">→</button></div>
  </div>
  <noscript><p>启用 JavaScript 查看轮播，或<a href="https://dptech.zhiye.com/jobs" target="_blank" rel="noopener noreferrer">前往招聘官网</a>。</p></noscript>
</aside>
{{ $feed := resources.Get "js/jobs-feed.js" | minify | fingerprint }}<script defer src="{{ $feed.RelPermalink }}"></script>
{{ $script := resources.Get "js/jobs-widget.js" | minify | fingerprint }}<script defer src="{{ $script.RelPermalink }}"></script>

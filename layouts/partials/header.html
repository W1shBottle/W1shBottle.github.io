<div class="site-head">
<a class="brand" href="{{ "/" | relURL }}">WishBottle<span class="brand-dot">.</span></a>
<nav class="site-nav" aria-label="博客导航">
{{ $current := .RelPermalink }}
{{ range site.Params.menu }}
<a href="{{ .url | relURL }}"{{ if or (eq $current .url) (and (ne .url "/") (hasPrefix $current .url)) }} aria-current="page"{{ end }}>{{ .name }}</a>
{{ end }}
</nav>
{{ $dark := eq (site.Params.theme | default "light") "dark" }}
<button id="theme" class="theme-button theme-lamp" type="button" aria-label="{{ if $dark }}切换到日间模式{{ else }}切换到夜间模式{{ end }}" aria-pressed="{{ $dark }}" title="{{ if $dark }}切换到日间模式{{ else }}切换到夜间模式{{ end }}">
  <svg class="theme-lamp-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <g class="theme-lamp-sun"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></g>
    <path class="theme-lamp-moon" d="M19.6 14.3A7.6 7.6 0 0 1 9.7 4.4a7.7 7.7 0 1 0 9.9 9.9Z"/>
  </svg>
</button>
</div>

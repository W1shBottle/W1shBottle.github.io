<div class="site-head">
<a class="brand" href="{{ "/" | relURL }}">WishBottle<span class="brand-dot">.</span></a>
<nav class="site-nav" aria-label="博客导航">
{{ $current := .RelPermalink }}
{{ range site.Params.menu }}
<a href="{{ .url | relURL }}"{{ if or (eq $current .url) (and (ne .url "/") (hasPrefix $current .url)) }} aria-current="page"{{ end }}>{{ .name }}</a>
{{ end }}
</nav>
<button id="theme" class="theme-button" type="button" aria-label="切换深色主题" aria-pressed="false"><span class="theme-track" aria-hidden="true"><span class="theme-thumb"></span></span><span class="theme-label">浅色</span></button>
</div>

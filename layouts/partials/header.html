<div class="site-head">
<a class="brand" href="{{ "/" | relURL }}">WishBottle<span class="brand-dot">.</span></a>
<nav class="site-nav" aria-label="博客导航">
{{ $current := .RelPermalink }}
{{ range site.Params.menu }}
<a href="{{ .url | relURL }}"{{ if or (eq $current .url) (and (ne .url "/") (hasPrefix $current .url)) }} aria-current="page"{{ end }}>{{ .name }}</a>
{{ end }}
</nav>
{{ $dark := eq (site.Params.theme | default "light") "dark" }}
<button id="theme" class="theme-button" type="button" aria-label="{{ if $dark }}切换浅色主题{{ else }}切换 One Dark 主题{{ end }}" aria-pressed="{{ $dark }}"><span class="theme-track" aria-hidden="true"><span class="theme-thumb"></span></span><span class="theme-label">{{ if $dark }}One Dark{{ else }}浅色{{ end }}</span></button>
</div>

<div class="journey-meter" role="img" aria-label="{{ .label }}：共 {{ .stats.total }} 项，{{ .stats.accepted }} 项已验收，{{ .stats.practicing }} 项跟练中，{{ .stats.planned }} 项待学习或实践">
  <div class="journey-meter-accepted" style="{{ printf "width:%.4f%%" (float .stats.accepted_width) | safeCSS }}"></div>
  <div class="journey-meter-practicing" style="{{ printf "width:%.4f%%" (float .stats.practicing_width) | safeCSS }}"></div>
</div>
